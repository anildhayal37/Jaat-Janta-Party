# Netlify config — Jaat Janta Party static site
# No build step required: plain HTML/CSS/JS in repo root.

[build]
  publish = "."
  command = ""

[build.environment]
  NODE_VERSION = "20"

# Cache static assets aggressively
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/script.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Always serve the latest HTML
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Friendly 404 (uses index.html as fallback for now)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
