<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Outer rosette ring -->
  <defs>
    <radialGradient id="ring" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FF8A3D"/>
      <stop offset="100%" stop-color="#E55400"/>
    </radialGradient>
    <linearGradient id="buff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5A3A22"/>
      <stop offset="100%" stop-color="#2A1610"/>
    </linearGradient>
  </defs>

  <!-- 12-point sun/rosette -->
  <g transform="translate(100 100)">
    <g fill="url(#ring)" stroke="#3A2418" stroke-width="2">
      <polygon points="0,-92 8,-70 -8,-70" transform="rotate(0)"/>
      <polygon points="0,-92 8,-70 -8,-70" transform="rotate(30)"/>
      <polygon points="0,-92 8,-70 -8,-70" transform="rotate(60)"/>
      <polygon points="0,-92 8,-70 -8,-70" transform="rotate(90)"/>
      <polygon points="0,-92 8,-70 -8,-70" transform="rotate(120)"/>
      <polygon points="0,-92 8,-70 -8,-70" transform="rotate(150)"/>
      <polygon points="0,-92 8,-70 -8,-70" transform="rotate(180)"/>
      <polygon points="0,-92 8,-70 -8,-70" transform="rotate(210)"/>
      <polygon points="0,-92 8,-70 -8,-70" transform="rotate(240)"/>
      <polygon points="0,-92 8,-70 -8,-70" transform="rotate(270)"/>
      <polygon points="0,-92 8,-70 -8,-70" transform="rotate(300)"/>
      <polygon points="0,-92 8,-70 -8,-70" transform="rotate(330)"/>
    </g>
  </g>

  <!-- Cream circle disk -->
  <circle cx="100" cy="100" r="72" fill="#F5EBD8" stroke="#3A2418" stroke-width="4"/>
  <circle cx="100" cy="100" r="64" fill="#FFFBF2" stroke="#3A2418" stroke-width="1.5" stroke-dasharray="3 4"/>

  <!-- Buffalo silhouette -->
  <g transform="translate(100 108)">
    <!-- Horns -->
    <path d="M -42 -22 C -64 -38, -58 -52, -38 -42 C -28 -36, -24 -28, -22 -22 Z"
          fill="url(#buff)" stroke="#3A2418" stroke-width="2"/>
    <path d="M 42 -22 C 64 -38, 58 -52, 38 -42 C 28 -36, 24 -28, 22 -22 Z"
          fill="url(#buff)" stroke="#3A2418" stroke-width="2"/>
    <!-- Head -->
    <path d="M -30 -18
             C -34 -2, -28 18, -14 24
             C -6 28, 6 28, 14 24
             C 28 18, 34 -2, 30 -18
             C 22 -28, 8 -32, 0 -32
             C -8 -32, -22 -28, -30 -18 Z"
          fill="url(#buff)" stroke="#3A2418" stroke-width="2"/>
    <!-- Eyes -->
    <circle cx="-11" cy="-8" r="2.5" fill="#FFFBF2"/>
    <circle cx="11" cy="-8" r="2.5" fill="#FFFBF2"/>
    <!-- Nose ring + nostrils -->
    <ellipse cx="-5" cy="4" rx="1.4" ry="2" fill="#FFFBF2"/>
    <ellipse cx="5" cy="4" rx="1.4" ry="2" fill="#FFFBF2"/>
    <!-- Tilak -->
    <path d="M -2 -22 L 2 -22 L 0 -14 Z" fill="#FF6B1A" stroke="#3A2418" stroke-width="0.7"/>
    <!-- Handlebar mustache -->
    <path d="M -22 14
             C -16 8, -10 10, -2 14
             C 0 15, 0 15, 2 14
             C 10 10, 16 8, 22 14
             C 18 18, 12 18, 6 16
             C 2 15, -2 15, -6 16
             C -12 18, -18 18, -22 14 Z"
          fill="#1A0E08" stroke="#1A0E08" stroke-width="1"/>
    <!-- Curled tips -->
    <path d="M -22 14 C -26 12, -28 8, -24 6"
          fill="none" stroke="#1A0E08" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 22 14 C 26 12, 28 8, 24 6"
          fill="none" stroke="#1A0E08" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- JJP banner -->
  <g>
    <rect x="55" y="158" width="90" height="22" rx="4" fill="#3D5C2A" stroke="#3A2418" stroke-width="2"/>
    <text x="100" y="174" text-anchor="middle"
          font-family="Anton, Impact, sans-serif"
          font-size="16" fill="#F4B400" letter-spacing="2">JJP</text>
  </g>
</svg>
