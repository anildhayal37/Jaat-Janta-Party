name: Deploy to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      site_name:
        description: "Netlify subdomain (e.g. 'jaat-janta-party' -> jaat-janta-party.netlify.app). Must be globally unique."
        required: false
        default: "jaat-janta-party"

permissions:
  contents: read

concurrency:
  group: deploy-netlify
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      SITE_NAME: ${{ inputs.site_name || 'jaat-janta-party' }}
    steps:
      - name: Validate secret
        run: |
          if [ -z "${NETLIFY_AUTH_TOKEN}" ]; then
            echo "::error::Add a NETLIFY_AUTH_TOKEN repository secret first: https://github.com/${{ github.repository }}/settings/secrets/actions/new"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Install Netlify CLI
        run: npm install -g netlify-cli@latest

      - name: Find or create Netlify site
        id: site
        run: |
          set -euo pipefail
          # Try to find by name
          SITE_ID=$(curl -sS -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            "https://api.netlify.com/api/v1/sites?per_page=200" \
            | jq -r --arg n "$SITE_NAME" '.[] | select(.name==$n) | .site_id' | head -1)

          if [ -z "$SITE_ID" ] || [ "$SITE_ID" = "null" ]; then
            echo "Creating new site: $SITE_NAME"
            RESPONSE=$(curl -sS -X POST \
              -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg n "$SITE_NAME" '{name:$n}')" \
              "https://api.netlify.com/api/v1/sites")
            SITE_ID=$(echo "$RESPONSE" | jq -r '.site_id // .id // empty')
            if [ -z "$SITE_ID" ]; then
              echo "::error::Site creation failed. Pick a different SITE_NAME (must be globally unique). Response: $(echo "$RESPONSE" | head -c 400)"
              exit 1
            fi
          else
            echo "Reusing existing site: $SITE_NAME ($SITE_ID)"
          fi

          ACCOUNT_SLUG=$(curl -sS -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            "https://api.netlify.com/api/v1/sites/$SITE_ID" | jq -r '.account_slug // .account_id // empty')

          echo "site_id=$SITE_ID" >> "$GITHUB_OUTPUT"
          echo "account_slug=$ACCOUNT_SLUG" >> "$GITHUB_OUTPUT"
          echo "::notice::Site=$SITE_NAME id=$SITE_ID account=$ACCOUNT_SLUG"

      - name: Upsert Netlify function env vars
        env:
          NETLIFY_SITE_ID: ${{ steps.site.outputs.site_id }}
          ACCOUNT_SLUG: ${{ steps.site.outputs.account_slug }}
          ADMIN_KEY_INPUT: ${{ secrets.ADMIN_KEY }}
        run: |
          set -euo pipefail
          ADMIN_KEY="${ADMIN_KEY_INPUT:-jaat-admin-$(openssl rand -hex 6)}"
          echo "::add-mask::$ADMIN_KEY"

          upsert() {
            local KEY=$1
            local VAL=$2
            curl -sS -X DELETE \
              -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
              "https://api.netlify.com/api/v1/accounts/$ACCOUNT_SLUG/env/$KEY?site_id=$NETLIFY_SITE_ID" \
              -o /dev/null || true
            # Note: 'scopes' field requires a paid Netlify plan. Omitting it
            # uses the free-tier default (var available to all scopes).
            local PAYLOAD
            PAYLOAD=$(jq -n --arg k "$KEY" --arg v "$VAL" \
              '[{key:$k, values:[{value:$v, context:"all"}]}]')
            local CODE
            CODE=$(curl -sS -o /tmp/resp.json -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD" \
              "https://api.netlify.com/api/v1/accounts/$ACCOUNT_SLUG/env?site_id=$NETLIFY_SITE_ID")
            if [ "$CODE" -ge 300 ]; then
              echo "::error::Failed to set $KEY: HTTP $CODE $(head -c 300 /tmp/resp.json)"
              exit 1
            fi
          }

          upsert NETLIFY_AUTH_TOKEN "$NETLIFY_AUTH_TOKEN"
          upsert SITE_ID "$NETLIFY_SITE_ID"
          upsert ADMIN_KEY "$ADMIN_KEY"

          # Stash the (possibly random) admin key for the summary step
          echo "ADMIN_KEY_FINAL=$ADMIN_KEY" >> "$GITHUB_ENV"

      - name: Deploy to Netlify
        env:
          NETLIFY_SITE_ID: ${{ steps.site.outputs.site_id }}
        run: |
          set -euo pipefail
          MSG=$(git log -1 --pretty=format:'%s')
          netlify deploy --prod --dir=. --site="$NETLIFY_SITE_ID" --message="$MSG"

      - name: Summary
        env:
          NETLIFY_SITE_ID: ${{ steps.site.outputs.site_id }}
        run: |
          set -euo pipefail
          URL=$(curl -sS -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID" | jq -r '.ssl_url // .url')
          {
            echo "## Deployed"
            echo ""
            echo "- Live: $URL"
            echo "- Admin: $URL/admin.html"
            echo "- Netlify Forms dashboard: https://app.netlify.com/sites/$SITE_NAME/forms"
            echo ""
            echo "The ADMIN_KEY is set as a Netlify function env var. If you didn't provide one via the ADMIN_KEY GitHub Secret, a random one was generated (masked in logs). Set ADMIN_KEY as a repo secret to control it."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Deployed to $URL"
